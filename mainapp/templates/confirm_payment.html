{% extends "base2.html" %}
{% load static %}

{% block title %}Confirm Deposit{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
<style>
    .preview-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
    }
    .preview-item {
        position: relative;
        width: 100px;
        text-align: center;
        font-size: 0.85rem;
    }
    .preview-item img {
        max-width: 100%;
        border-radius: 8px;
        height: 80px;
        object-fit: cover;
    }
    .preview-item .filename {
        display: block;
        margin-top: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    textarea {
        resize: none;
    }
</style>
{% endblock %}

{% block content %}
<main class="dashboard-main">
    <section class="dashboard-section active">
        <h2>Confirm Your Deposit</h2>
        <div class="settings-container" style="margin: 0 auto;">
            <form id="depositConfirmationForm" class="settings-form" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- File Upload -->
                <div class="form-group">
                    <label for="file">
                        <i class="fas fa-upload"></i> Proof of Payment
                    </label>
                    <input type="file" 
                           id="file" 
                           name="uploaded_file" 
                           accept="image/*,application/pdf"
                           required
                           multiple>
                    <p class="info-text">Upload a screenshot or PDF receipt</p>
                    <div class="preview-container" id="previewContainer"></div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">
                        <i class="fas fa-align-left"></i> Description
                    </label>
                    <textarea id="description" 
                              name="description" 
                              rows="4" 
                              placeholder="Include any relevant info like transaction ID or amount"
                              class="form-control"
                              required></textarea>
                    <p class="info-text">Describe your transaction</p>
                </div>

                <!-- Submit -->
                <div class="form-group button-group">
                    <button type="submit" class="btn btn-primary" style="background-color: var(--primary-color); color: var(--text-color); border: none;">
                        <i class="fas fa-paper-plane"></i> Submit Confirmation
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
document.getElementById('file').addEventListener('change', function(e) {
    const container = document.getElementById('previewContainer');
    container.innerHTML = ''; // clear previous

    Array.from(e.target.files).forEach(file => {
        const item = document.createElement('div');
        item.classList.add('preview-item');

        if (file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.onload = () => URL.revokeObjectURL(img.src); // free memory
            item.appendChild(img);
        } else {
            const icon = document.createElement('div');
            icon.innerHTML = '<i class="fas fa-file-pdf fa-3x" style="color:#d9534f;"></i>';
            item.appendChild(icon);
        }

        const label = document.createElement('span');
        label.classList.add('filename');
        label.textContent = file.name;
        item.appendChild(label);

        container.appendChild(item);
    });
});
</script>

<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
